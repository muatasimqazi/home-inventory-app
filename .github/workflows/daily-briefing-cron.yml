name: Daily briefing cron

# Pings send-daily-briefing hourly (Vercel Cron itself can't: this
# account is on Vercel's Hobby plan, which caps its own Cron Jobs
# feature at once a day, but the per-user custom send-hour this route
# supports needs an hourly check — see that route's own doc comment).
# GitHub Actions' `schedule` trigger only fires off the workflow file as
# it exists on the repo's default branch (main here, not develop, which
# is where all real app development happens) — this file has to be kept
# in sync on both.
#
# CRON_SECRET is a repo secret (Settings > Secrets and variables >
# Actions), the same bearer token every other cron-triggered route in
# this app already checks.
#
# Runs at :07, not :00 — GitHub's own docs call out the top of every
# hour as the highest-load, most-delayed time for `schedule` triggers
# ("To decrease the chance of delay, schedule your workflow to run at a
# different time of the hour"), and a real run confirmed it: the very
# first :00 tick after this workflow went live never fired at all
# (only the manual workflow_dispatch test run showed up in the run
# history, even 15+ minutes past that hour). Running a few minutes
# off the hour doesn't change which local hour the route matches
# against (still whole-hour resolution, lib/timezone.ts's
# currentLocalHour), just avoids the exact-`:00` pileup.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-daily-briefing
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST "https://schuaz.com/api/v1/push/send-daily-briefing" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response status: $status"
          cat response.txt
          if [ "$status" -ge 300 ]; then
            echo "::error::send-daily-briefing returned $status"
            exit 1
          fi
