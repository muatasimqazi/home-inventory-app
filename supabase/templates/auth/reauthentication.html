<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f3f4f6;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1a1d29;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f4f6;margin:0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #ebf0f4;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 8px;">
                <div style="font-size:22px;line-height:28px;font-weight:700;color:#1a1d29;">Schuaz</div>
                <div style="margin-top:4px;font-size:12px;line-height:16px;color:#6b7280;">Household inventory and finance</div>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px 28px;">
                <h1 style="margin:0 0 12px;font-size:26px;line-height:32px;font-weight:700;color:#1a1d29;">Your verification code</h1>
                <p style="margin:0 0 16px;font-size:16px;line-height:24px;color:#1a1d29;">Use this code to verify your identity in Schuaz.</p>
                <div style="display:inline-block;border-radius:16px;background:#e8ede5;color:#1a1d29;font-size:30px;line-height:36px;font-weight:800;letter-spacing:4px;padding:14px 20px;">{{ .Token }}</div>
              </td>
            </tr>
          </table>
          <p style="max-width:560px;margin:16px 0 0;font-size:12px;line-height:16px;color:#6b7280;">If you did not request this code, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
