<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f3f4f6;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:#1a1d29;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f4f6;margin:0;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #ebf0f4;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 8px;">
                <div style="font-size:22px;line-height:28px;font-weight:700;color:#1a1d29;">Schuaz</div>
                <div style="margin-top:4px;font-size:12px;line-height:16px;color:#6b7280;">Household inventory and finance</div>
              </td>

                <a href="{{ .SiteURL }}/reset-password" style="display:inline-block;border-radius:16px;background:#a31b1b;color:#ffffff;font-size:16px;line-height:20px;font-weight:700;text-decoration:none;padding:14px 22px;">Reset password</a>

            </tr>
          </table>
