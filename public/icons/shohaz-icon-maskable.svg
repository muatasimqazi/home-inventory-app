<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Schuaz app icon (maskable)</title>
  <desc id="desc">Full-bleed teal background with the roofline-and-inventory-grid mark scaled into the safe zone, for platforms that crop app icons into a circle/squircle (Android adaptive icons).</desc>
  <!-- Full-bleed background, no inset/rounding of its own — the OS applies
       its own mask shape on top, so any transparent or white margin here
       would show through as a gap in whatever shape it crops to. -->
  <rect width="1024" height="1024" fill="#316A68"/>
  <!-- Same artwork as shohaz-icon.svg's mark, scaled 0.7x around the
       canvas center so its bounding-box corners land inside the
       recommended ~66%-diameter safe-zone circle (radius 338px from
       center) instead of reaching to ~427px, which a tight circular mask
       would have clipped. -->
  <g transform="translate(512 512) scale(0.7) translate(-512 -512)">
    <path
      d="M246 476 L512 244 L778 476"
      fill="none"
      stroke="#F8D377"
      stroke-width="70"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <rect x="314" y="552" width="118" height="118" rx="20" fill="#FFFFFF"/>
    <rect x="453" y="552" width="118" height="118" rx="20" fill="#FFFFFF"/>
    <rect x="592" y="552" width="118" height="118" rx="20" fill="#F8D377"/>
    <rect x="314" y="696" width="118" height="118" rx="20" fill="#FFFFFF"/>
    <rect x="453" y="696" width="118" height="118" rx="20" fill="#FFFFFF"/>
    <rect x="592" y="696" width="118" height="118" rx="20" fill="#FFFFFF"/>
  </g>
</svg>
